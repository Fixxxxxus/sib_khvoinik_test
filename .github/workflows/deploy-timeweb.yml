name: Deploy to Timeweb (gazony.ru)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build for gazony.ru
        env:
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: |
          cp -r docs deploy
          # Убираем GitHub Pages префикс из HTML и JS
          find deploy -name '*.html' -exec sed -i 's|/sib_khvoinik_test/|/|g' {} +
          find deploy -name '*.html' -exec sed -i 's|/sib_khvoinik_test"|/"|g' {} +
          find deploy -name '*.js' -exec sed -i 's|/sib_khvoinik_test|/|g' {} +
          # Подставляем Yandex Maps API key
          if [ -n "$YANDEX_MAPS_API_KEY" ]; then
            find deploy -name '*.html' -exec sed -i "s|__YANDEX_MAPS_API_KEY__|${YANDEX_MAPS_API_KEY}|g" {} +
          fi

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.htaccess'
          path: deploy/
          remote_path: /home/a/${{ secrets.SSH_USER }}/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
