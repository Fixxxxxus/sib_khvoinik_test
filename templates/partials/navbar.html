{% load static %}
<header id="site-header" class="sticky top-0 z-50 border-b border-slate-200 bg-white">
  <!-- Десктоп: логотип слева, ссылки по центру, справа мессенджеры и звонок -->
  <div class="sg-nav-fallback-desktop mx-auto hidden w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:gap-4 sm:px-6 md:flex lg:gap-6 lg:px-8">
    <a href="{% url 'home' %}" class="flex shrink-0 items-center">
      <img
        src="{% static 'media/branding/logo-main.webp' %}"
        alt="Сибирские газоны"
        class="h-9 w-auto sm:h-10"
        loading="eager"
        decoding="async"
      />
    </a>
    <nav
      class="flex min-w-0 flex-1 flex-nowrap items-center justify-center gap-x-2 gap-y-1 overflow-x-auto px-1.5 py-0.5 sm:gap-x-2.5 sm:px-2 lg:gap-x-3 lg:px-2.5 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden"
      aria-label="Основное меню"
    >
      <a href="{% url 'home' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Главная
      </a>
      <a href="{% url 'gazon' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Газон
      </a>
      <a href="{% url 'ozelenenie_b2c' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Озеленение
      </a>
      <a href="{% url 'b2b' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        B2B
      </a>
      <a href="{% url 'pitomnik' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Питомник
      </a>
      <a href="{% url 'sadovye_centry' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Садовые центры
      </a>
      <a href="{% url 'katalog' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Каталог
      </a>
      <a href="{% url 'stati_list' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Статьи
      </a>
      <a href="{% url 'kontakty' %}" class="whitespace-nowrap py-1.5 text-[15px] text-slate-700 transition hover:text-brand sm:text-[16px]">
        Контакты
      </a>
    </nav>
    <div class="flex shrink-0 items-center gap-2">
      <a
        href="https://max.ru/join/UcCEFlabfpAocHobifXghtEecgUghhCLy6gD6vAHMXM"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="MAX"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-indigo-200/80 bg-gradient-to-br from-indigo-50 to-violet-50 text-[11px] font-semibold text-indigo-700 shadow-sm transition hover:-translate-y-0.5 hover:border-indigo-300 hover:shadow"
      >
        MAX
      </a>
      <a
        href="https://t.me/sibirskie_gazony"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Telegram"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-sky-200/80 bg-gradient-to-br from-sky-50 to-cyan-50 text-sky-700 shadow-sm transition hover:-translate-y-0.5 hover:border-sky-300 hover:shadow"
      >
        <i data-lucide="send" class="h-4 w-4" aria-hidden="true"></i>
      </a>
      <a
        href="https://vk.com/sibirskiegazony"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="VK"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-blue-200/80 bg-gradient-to-br from-blue-50 to-slate-50 text-[12px] font-semibold tracking-wide text-blue-700 shadow-sm transition hover:-translate-y-0.5 hover:border-blue-300 hover:shadow"
      >
        VK
      </a>
      <a
        href="tel:+73832010600"
        class="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand to-brand2 px-4 py-2 text-sm font-semibold text-white shadow-glow transition hover:brightness-105 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand sm:px-5 sm:py-2.5 sm:text-[15px]"
      >
        <i data-lucide="phone-call" class="h-4 w-4 shrink-0" aria-hidden="true"></i>
        Позвонить
      </a>
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- Мобильная верхняя строка: лого + действия -->
    <div class="sg-nav-fallback-mobile-bar flex items-center justify-between gap-3 py-2.5 md:hidden">
      <a href="{% url 'home' %}" class="flex min-w-0 items-center">
        <img
          src="{% static 'media/branding/logo-main.webp' %}"
          alt="Сибирские газоны"
          class="h-9 w-auto max-h-9"
          loading="eager"
          decoding="async"
        />
      </a>
      <div class="flex shrink-0 items-center gap-1.5">
        <a
          href="https://max.ru/join/UcCEFlabfpAocHobifXghtEecgUghhCLy6gD6vAHMXM"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="MAX"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-indigo-200/80 bg-gradient-to-br from-indigo-50 to-violet-50 text-[9px] font-semibold text-indigo-700 shadow-sm"
        >
          MAX
        </a>
        <a
          href="https://t.me/sibirskie_gazony"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Telegram"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-sky-200/80 bg-gradient-to-br from-sky-50 to-cyan-50 text-sky-700 shadow-sm"
        >
          <i data-lucide="send" class="h-3.5 w-3.5" aria-hidden="true"></i>
        </a>
        <a
          href="https://vk.com/sibirskiegazony"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="VK"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-blue-200/80 bg-gradient-to-br from-blue-50 to-slate-50 text-[10px] font-semibold tracking-wide text-blue-700 shadow-sm"
        >
          VK
        </a>
        <a
          href="tel:+73832010600"
          aria-label="Позвонить"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-emerald-200/80 bg-gradient-to-br from-emerald-50 to-green-50 text-emerald-700 shadow-sm"
        >
          <i data-lucide="phone-call" class="h-3.5 w-3.5" aria-hidden="true"></i>
        </a>
        <button
          id="burgerBtn"
          type="button"
          class="inline-flex items-center justify-center rounded-xl border border-slate-200 p-2 text-slate-700 hover:bg-slate-50 transition"
          aria-label="Открыть меню"
          aria-expanded="false"
        >
          <i data-lucide="menu" class="h-5 w-5"></i>
        </button>
      </div>
    </div>
  </div>

  <div id="mobileMenu" class="sg-mobile-menu-panel hidden border-b border-slate-200 bg-white md:hidden">
    <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 gap-1">
        <a href="{% url 'home' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">

        </a>
        <a href="{% url 'gazon' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">

        </a>
        <a href="{% url 'ozelenenie_b2c' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">

        </a>

        </a>
        <a href="{% url 'pitomnik' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">
          Питомник
        </a>
        <a href="{% url 'sadovye_centry' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">

        </a>
        <a href="{% url 'katalog' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">

        </a>
        <a href="{% url 'stati_list' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">
          Статьи
        </a>
        <a href="{% url 'kontakty' %}" class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-brand/5 hover:text-brand transition">
          Контакты
        </a>
        <div class="mt-2 grid grid-cols-4 gap-2">
          <a
            href="https://max.ru/join/UcCEFlabfpAocHobifXghtEecgUghhCLy6gD6vAHMXM"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MAX"
            class="inline-flex items-center justify-center rounded-xl border border-indigo-200/80 bg-gradient-to-br from-indigo-50 to-violet-50 px-2 py-2.5 text-[11px] font-semibold text-indigo-700 shadow-sm"
          >
            MAX
          </a>
          <a
            href="https://t.me/sibirskie_gazony"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
            class="inline-flex items-center justify-center rounded-xl border border-sky-200/80 bg-gradient-to-br from-sky-50 to-cyan-50 px-2 py-2.5 text-sky-700 shadow-sm"
          >
            <i data-lucide="send" class="h-4 w-4" aria-hidden="true"></i>
          </a>
          <a
            href="https://vk.com/sibirskiegazony"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="VK"
            class="inline-flex items-center justify-center rounded-xl border border-blue-200/80 bg-gradient-to-br from-blue-50 to-slate-50 px-2 py-2.5 text-[12px] font-semibold tracking-wide text-blue-700 shadow-sm"
          >
            VK
          </a>
          <a
            href="tel:+73832010600"
            class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-brand to-brand2 px-2 py-2.5 text-xs font-semibold text-white shadow-glow"

        </div>
      </div>
    </div>
  </div>
</header>
