{% load static %}
<div id="centersWidget" class="sg-centers-widget" aria-hidden="true" role="complementary" aria-label="Открыли два садовых центра">
  <button type="button" class="sg-centers-widget__fab" aria-label="Открыли два садовых центра - посмотреть адреса" data-centers-widget-fab>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
    <span class="sg-centers-widget__fab-dot" aria-hidden="true"></span>
  </button>
  <span class="sg-centers-widget__strip" aria-hidden="true"></span>
  <button type="button" class="sg-centers-widget__close" aria-label="Скрыть виджет" data-centers-widget-close>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
  <div class="sg-centers-widget__body">
    <p class="sg-centers-widget__title">Открыли два садовых центра</p>
    <a href="/sadovye-centry/?show=centers" class="sg-centers-widget__cta" data-centers-widget-cta>
      Адреса и контакты →
    </a>
  </div>
</div>

<style>
  .sg-centers-widget {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 60;
    width: 240px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1), transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sg-centers-widget.is-open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .sg-centers-widget__strip {
    display: block;
    height: 3px;
    background: linear-gradient(90deg, #2D6A4F 0%, #40916C 55%, #E9C46A 100%);
  }
  .sg-centers-widget__close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.06);
    color: #475569;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
    z-index: 2;
  }
  .sg-centers-widget__close:hover,
  .sg-centers-widget__close:focus-visible {
    background: rgba(15, 23, 42, 0.12);
    color: #0f172a;
    outline: none;
  }
  .sg-centers-widget__body {
    padding: 12px 14px 14px;
  }
  .sg-centers-widget__title {
    margin: 0;
    color: #0f172a;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    padding-right: 22px;
  }
  .sg-centers-widget__meta {
    margin: 4px 0 10px;
    color: #475569;
    font-size: 12px;
    line-height: 1.4;
  }
  .sg-centers-widget__cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 9px 12px;
    background: linear-gradient(135deg, #2D6A4F 0%, #40916C 100%);
    color: #fff;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.1;
    text-decoration: none;
    transition: background 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms ease, transform 120ms ease;
  }
  .sg-centers-widget__cta:hover,
  .sg-centers-widget__cta:focus-visible {
    background: linear-gradient(135deg, #245A41 0%, #357C5A 100%);
    box-shadow: 0 10px 22px rgba(45, 106, 79, 0.32);
    outline: none;
  }
  .sg-centers-widget__cta:active {
    transform: translateY(1px);
  }

  /* FAB (компактная пилюля для мобилки) - на десктопе скрыта */
  .sg-centers-widget__fab {
    display: none;
  }

  @media (max-width: 640px) {
    /* На мобилке по умолчанию виджет - это просто FAB, без фона/тени контейнера */
    .sg-centers-widget {
      width: auto;
      left: 16px;
      right: auto;
      bottom: 16px;
      max-width: none;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      overflow: visible;
    }
    .sg-centers-widget__strip,
    .sg-centers-widget__close,
    .sg-centers-widget__body {
      display: none;
    }
    .sg-centers-widget__fab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2D6A4F 0%, #40916C 100%);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.28);
      position: relative;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .sg-centers-widget__fab:hover,
    .sg-centers-widget__fab:focus-visible {
      transform: scale(1.05);
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.34);
      outline: none;
    }
    .sg-centers-widget__fab:active {
      transform: scale(0.97);
    }
    .sg-centers-widget__fab-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #E9C46A;
      border: 2px solid #fff;
    }

    /* Раскрытое состояние на мобилке - полная карточка, FAB скрыт */
    .sg-centers-widget.is-expanded {
      left: 16px;
      right: 16px;
      max-width: calc(100vw - 32px);
      background: #fff;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
      border-radius: 16px;
      overflow: hidden;
    }
    .sg-centers-widget.is-expanded .sg-centers-widget__fab {
      display: none;
    }
    .sg-centers-widget.is-expanded .sg-centers-widget__strip {
      display: block;
    }
    .sg-centers-widget.is-expanded .sg-centers-widget__close {
      display: inline-flex;
    }
    .sg-centers-widget.is-expanded .sg-centers-widget__body {
      display: block;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .sg-centers-widget,
    .sg-centers-widget__cta,
    .sg-centers-widget__fab {
      transition: none;
    }
  }
</style>
