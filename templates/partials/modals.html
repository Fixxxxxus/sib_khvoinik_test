{% load static %}
<div id="modalOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden"></div>

<!-- Generic modal wrapper -->
<div id="modalHost" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-3 sm:p-4">
  <div class="w-full max-w-lg">
    <div class="relative overflow-hidden rounded-3xl border border-black/10 bg-white shadow-soft max-h-[92dvh]">
      <button
        type="button"
        id="modalCloseTop"
        class="absolute right-3 top-3 inline-flex h-9 w-9 items-center justify-center rounded-xl hover:bg-black/5 transition"
        aria-label="Закрыть"
      >
        <i data-lucide="x" class="h-5 w-5"></i>
      </button>
      <div class="p-4 sm:p-6 overflow-y-auto max-h-[calc(92dvh-1rem)] sm:max-h-[calc(92dvh-1.5rem)]">
        <h3 id="modalTitle" class="text-xl font-semibold leading-tight"></h3>
        <div id="modalBody" class="mt-4"></div>
      </div>
    </div>
  </div>
</div>

<!-- UI-only content templates -->
<template id="modal-template-mini_brief">
  <form class="space-y-4" data-ui-form data-form-tag="B2C/mini-brief" data-modal-success="true">
    <input type="hidden" name="formTag" value="B2C/mini-brief" />
    <div class="grid grid-cols-1 gap-3">
      <label class="text-sm font-medium text-slate-700">
        Тип объекта
        <input name="objectType" required class="mt-1 w-full rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-brand/20" placeholder="Частный дом / коттедж / ЖК" />
      </label>
      <label class="text-sm font-medium text-slate-700">
        Площадь, м²
        <input name="area" type="number" required min="1" class="mt-1 w-full rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-brand/20" placeholder="Напр. 350" />
      </label>
      <label class="text-sm font-medium text-slate-700">
        Регион
        <input name="region" required class="mt-1 w-full rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-brand/20" placeholder="Напр. Новосибирск" />
      </label>
      <label class="text-sm font-medium text-slate-700">
        Телефон
        <input name="phone" required class="mt-1 w-full rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-brand/20" placeholder="+7 ..." />
      </label>
    </div>
    <button class="w-full rounded-2xl bg-gradient-to-r from-brand to-brand2 px-6 py-3 text-white font-semibold shadow-glow hover:brightness-105 transition">
      Отправить
    </button>
  </form>
</template>

        Площадь, м²

        Телефон
        <input name="phone" required class="mt-1 w-full rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-brand/20" placeholder="+7 ..." />

<template id="modal-template-contact_zaboty_calendar">

      <label class="text-sm font-medium text-slate-700">

    <div class="space-y-3">
      <p class="text-sm font-medium leading-snug text-slate-800">
        По каким группам растений вы хотите получать напоминания и рекомендации по уходу:
      </p>

        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">

          <span>Сезонный календарь работ в саду <span class="text-slate-400">(главное на этой неделе)</span></span>
        </label>
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">

          <span>Деревья <span class="text-slate-400">(хвойные и лиственные)</span></span>
        </label>
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
          <input type="checkbox" name="care_shrubs" value="1" class="h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
          <span>Кустарники <span class="text-slate-400">(в т.ч. гортензия, яблоня декоративная)</span></span>
        </label>
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
          <input type="checkbox" name="care_perennials" value="1" class="h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
          <span>Многолетники <span class="text-slate-400">(в т.ч. пионы)</span></span>
        </label>
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
          <input type="checkbox" name="care_roses" value="1" class="h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
          <span>Розы</span>
        </label>
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
          <input type="checkbox" name="care_lawn" value="1" class="h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
          <span>Газон</span>
        </label>
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border-[1.5px] border-black/15 bg-white px-4 py-3 text-sm text-slate-700">
          <input type="checkbox" name="promo" value="1" class="h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
          <span>Хочу получать информацию о новинках и акциях</span>
        </label>
      </div>
    </div>

    <div class="space-y-3 rounded-2xl border border-black/10 bg-slate-50/80 p-4" data-care-channel-block>
      <div>
        <p class="text-sm font-medium text-slate-800">Куда удобнее получать напоминания</p>
        <div class="mt-2 flex flex-col gap-2 sm:flex-row">
          <label class="flex flex-1 cursor-pointer items-center gap-2.5 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
            <input type="radio" name="preferred_messenger" value="telegram" checked class="h-4 w-4 border-black/20 text-brand focus:ring-brand/30" />
            <i data-lucide="send" class="h-4 w-4 text-brand"></i>
            <span>Telegram</span>
          </label>
          <label class="flex flex-1 cursor-pointer items-center gap-2.5 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
            <input type="radio" name="preferred_messenger" value="max" class="h-4 w-4 border-black/20 text-brand focus:ring-brand/30" />
            <i data-lucide="message-circle" class="h-4 w-4 text-brand"></i>
            <span>MAX</span>
          </label>
          <label class="flex flex-1 cursor-pointer items-center gap-2.5 rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm text-slate-700">
            <input type="radio" name="preferred_messenger" value="email" class="h-4 w-4 border-black/20 text-brand focus:ring-brand/30" />
            <i data-lucide="mail" class="h-4 w-4 text-brand"></i>
            <span>Эл. почта</span>
          </label>
        </div>
      </div>
      <label class="block text-sm font-medium text-slate-700">
        Адрес электронной почты
        <input name="email" type="email" required class="mt-1 w-full rounded-2xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-brand/20" placeholder="name@example.com" autocomplete="email" />
        <span class="mt-1 block text-xs font-normal text-slate-500">Нужна в любом случае: продублируем напоминания письмом, даже если выбрали мессенджер.</span>
      </label>
      <label class="flex cursor-pointer items-start gap-3 text-sm leading-snug text-slate-700">
        <input type="checkbox" name="consent_messages" value="1" checked class="mt-0.5 h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
        <span>Даю согласие на получение сообщений</span>
      </label>
    </div>

    <label class="flex cursor-pointer items-start gap-3 text-sm leading-snug text-slate-700">
      <input type="checkbox" name="consent" value="1" required data-consent-checkbox class="mt-0.5 h-4 w-4 shrink-0 rounded border-black/20 text-brand focus:ring-brand/30" />
      <span>
        Даю согласие на обработку персональных данных в соответствии с
        <a href="{% url 'privacy' %}" class="text-brand underline underline-offset-2 hover:text-brand2" target="_blank" rel="noopener noreferrer">Политикой конфиденциальности</a>
      </span>
    </label>

    <button type="submit" data-consent-submit disabled class="w-full rounded-2xl bg-gradient-to-r from-brand to-brand2 px-6 py-3 text-white font-semibold shadow-glow hover:brightness-105 transition disabled:cursor-not-allowed disabled:opacity-60">
      Получать календарь сезонных работ
    </button>
  </form>
</template>
