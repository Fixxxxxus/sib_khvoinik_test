{% extends 'base.html' %}
{% block title %}{{ title }} — {{ brand }}{% endblock %}

{% block content %}
  <section class="relative isolate">
    <div class="absolute inset-0 -z-10 bg-gradient-to-br from-brand/30 via-brand2/15 to-brand/5"></div>
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 pt-16 pb-10 md:pt-20 md:pb-12">
      <div class="rounded-3xl border border-white/15 bg-white/90 backdrop-blur p-8 md:p-12">
        <h1 class="text-3xl md:text-4xl font-semibold leading-tight">{{ title }}</h1>
        <p class="mt-3 text-slate-600 max-w-3xl">
          Каталог разрабатывается! Здесь будет представлен актуальный на сегодня ассортимент нашей продукции.
        </p>
        <div class="mt-6 flex flex-col sm:flex-row sm:flex-wrap gap-3">
          <a href="{% url 'sadovye_centry' %}" class="inline-flex items-center justify-center rounded-2xl border border-black/10 bg-white px-6 py-3 font-semibold hover:bg-black/5 transition">
            Посмотреть в садовых центрах
          </a>
          <button type="button" data-open-modal="catalog_actual_stock" data-modal-title="Выслать актуальные остатки" class="inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-brand to-brand2 px-6 py-3 text-white font-semibold shadow-glow hover:brightness-105 transition">
            Выслать актуальные остатки
          </button>
          <button type="button" data-open-modal="catalog_electronic_catalog" data-modal-title="Получить электронный каталог" class="inline-flex items-center justify-center rounded-2xl border border-black/10 bg-white px-6 py-3 font-semibold hover:bg-black/5 transition">
            Получить электронный каталог
          </button>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
